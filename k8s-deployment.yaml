apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s
  template:
    metadata:
      labels:
        app: k8s
    spec:
      containers:
        - name: k8s-container
          image: my-react-app:v1
          imagePullPolicy: Never # Tells Kubernetes to use your local Docker image
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-app-service
spec:
  type: NodePort
  selector:
    app: k8s
  ports:
    - port: 80
      targetPort: 80